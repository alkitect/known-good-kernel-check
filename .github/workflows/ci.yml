name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install PyYAML
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
      - name: bash -n
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n
      - name: ci-check
        run: ./scripts/ci-check.sh
